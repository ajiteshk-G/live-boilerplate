[project]
name = "gemini-live-boilerplate"
version = "0.1.0"
description = "Config-driven boilerplate for Gemini Live bidirectional audio on Vertex AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gemini-live-telemetry>=0.1.1",
    "google-genai>=1.0.0",
    "mcp>=1.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML",
]

[project.scripts]
glive = "gemini_live.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_live"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
